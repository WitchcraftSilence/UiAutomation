name: GG Einnahme
hotkey: ctrl+alt+5

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.02, 0.06]    # Pause vor jedem Schritt (s), vorher [0.05, 0.12]
  typing_delay: [0.02, 0.06]  # Pause nach jedem Tastendruck, vorher [0.06, 0.15]
  move_speed: 1.2               # Maus 1,2× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]

matching:
  poll_interval: 0.05         # Pause zwischen zwei Bildsuchen (s), Standard 0.25: reagiert schneller


steps:
  - repeat:
      while:
        - GG/GG1 Angriff A.png
        - GG/GG1 Verteidigung A.png
      until: Gemeinsam/GG Niederlage.png
    steps:                      # gleiche Höhe wie "repeat:"
      - press: a
      - wait_for: Gemeinsam/EinheitenErsetzen R.png
      - press: r
      - press: b                # Kampfrunde 1
      - expect_not: Gemeinsam/EinheitenErsetzen R.png   # erst weiter, wenn der Armee-Dialog zu ist (der Knopf steht nur dort;
        think: 0                                        # Auto-Kampf steht auch im Dialog der zweiten Welle)
      - first_seen:             # nach Runde 1 kommt entweder das Ergebnis oder Kampfrunde 2
          - if: Gemeinsam/OK ESC.png   # fertig nach einer Runde
            then:
              - press: esc
          - if: Gemeinsam/AutoKampf B.png # es gibt eine zweite Runde
            then:
              - press: b        # Kampfrunde 2
              - if_seen: Gemeinsam/AutoKampf B.png   # Taste manchmal verschluckt: Dialog noch da, nochmal b
                timeout: 0.5
                then:
                  - press: b
              - wait_for: Gemeinsam/OK ESC.png
                timeout: 30     # Kampf kann dauern
                check_end: true # derselbe OK-Knopf steht im Niederlage-Dialog
              - press: esc
        timeout: 30             # so lange dauert Runde 1 höchstens

