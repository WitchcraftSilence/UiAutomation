name: Verhandlung
hotkey: ctrl+alt+8

# Start: die Verhandlung ist offen, darüber die Vorschlagstabelle "Person 1 … Person 5" (Bild 3).
human:
  think_time: [0.1, 0.25]     # Pause vor jedem Schritt (s), Standard [0.4, 1.2]
  move_speed: 1.2             # Maus 1,2× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


steps:
  # Runde für Runde: je Person mit Vorschlag Taste 1-5 (= "Angebot machen") -> vorgeschlagenes
  # Gut wählen, dann "Bezahlen & Verhandeln". Endet, sobald das Erfolgsbild erscheint.
  - negotiate:
      suggestions: GEX Verhandlung 3 Runde 1 Vorschlag.png   # nur die Kopfzeile "Person 1 … 5" wird gesucht
      menu: GEX Verhandlung 4d Ressource Waehlen.png  # Überschrift des Auswahlmenüs
      pay: GEX Verhandlung 4c Bezahlen.png
      success: GEX Verhandlung 9 Erfolg.png        # nur der Schriftzug ERFOLG auf dem grünen Band
    timeout: 5                # so lange wird auf Menü, Knopf und Ergebnis gewartet
  - press: esc               # Erfolgsfenster schließen
  - if_seen: GEX Verhandlung 10 Dipl Geschenk ESC.png
    timeout: 1.5
    then:
      - press: esc
