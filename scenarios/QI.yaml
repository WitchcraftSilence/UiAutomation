name: QI
hotkey: ctrl+alt+6

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.05, 0.12]    # Pause vor jedem Schritt (s), Standard [0.4, 1.2]; eingeübte Tastenfolgen
  move_speed: 1.2               # Maus 1,5× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


steps:
  - repeat:
      while: QI Kampf.png
    steps:                      # gleiche Höhe wie "repeat:"
      - click: QI Kampf.png
      - replace_damaged:        # beschädigte Einheiten gegen gesunde derselben Art tauschen
          army: QI Verteidigende Armee.png   # Armee, gefunden über die Überschrift
          pool: QI Available.png             # verfügbare Einheiten, gefunden über die Reiter
          empty: QI Leeres Feld.png          # leeres Feld: nur auffüllen, nichts herausnehmen
        if_missing:             # kein gesunder Ersatz: Sequenz beenden
          - end: kein gesunder Ersatz
      - press: b                # Auto-Kampf
      - first_seen:             # nach dem Kampf kommt entweder das Ergebnis oder die zweite Welle
          - if: QI OK.png
            then:
              - press: esc
          - if: QI Zweite Welle B.png
            then:
              - press: b        # Auto-Kampf für die zweite Welle
              - wait_for: QI OK.png
                timeout: 5      # Kampf kann dauern
              - press: esc
        timeout: 3              # so lange dauert der erste Kampf höchstens
      - repeat:                 # Belohnung schließen; Esc wiederholen, bis sie wirklich weg ist
          while: QI Belohnung ESC.png
          timeout: 1            # so lange wird nach der Belohnung gesucht
          max: 5
        steps:
          - press: esc
            think: [0.4, 0.7]   # erst warten, bis der Dialog fertig eingeblendet ist
