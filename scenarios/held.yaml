name: Held
hotkey: ctrl+alt+3

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.05, 0.2]      # Pause vor jedem Schritt (s), Standard [0.4, 1.2]
  move_speed: 1.2              # Maus 1,2× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


steps:
- repeat:                     # Schleife 1
    while: Held/Held1 A.png
    until: Held/Held Niederlage.png
  steps:                      # gleiche Höhe wie "repeat:"
    - click: Held/Held1 A.png
      grayscale: false            # nicht mit dem grauen End-Screen verwechseln
    - wait_for: Held/Held2 Ersetzen R.png
    - press: r
    - press: b
    - wait_for: Held/Held4 OK ESC.png
      check_end: true             # derselbe OK-Knopf steht im Niederlage-Dialog
    - press: esc
      timeout: 0.5
- if_seen: Held/Held Niederlage.png  # endete Schleife 1 mit einer Niederlage, erst den Dialog schließen
  timeout: 0.5
  then:
    - press: esc
    - expect_not: Held/Held Niederlage.png
- repeat:                     # Schleife 2, startet nach Schleife 1
    while: Held/Held5 V.png
    until: Held/Held Niederlage.png
  steps:
    - click: Held/Held5 V.png
      grayscale: false            # nicht mit dem grauen End-Screen verwechseln
    - wait_for: Held/Held6 Ersetzen R.png
    - press: r
    - press: b
    - wait_for: Held/Held8 OK ESC.png
      check_end: true             # derselbe OK-Knopf steht im Niederlage-Dialog
    - press: esc
      timeout: 0.5
