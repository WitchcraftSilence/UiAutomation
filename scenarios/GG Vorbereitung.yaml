name: GG Vorbereitung
hotkey: ctrl+alt+4

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.05, 0.12]    # Pause vor jedem Schritt (s), Standard [0.4, 1.2]; eingeübte Tastenfolgen
  move_speed: 1.2               # Maus 1,5× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


steps:
  - repeat:
      while:
        - GG1 Angriff A.png
        - GG1 Verteidigung A.png
      until: GG Niederlage.png
    steps:                      # gleiche Höhe wie "repeat:"
      - if_counter: GG Status.png   # Zähler "x/total" rechts in der Leiste lesen
        when: x >= total - 2
        timeout: 2              # so lange wird die Leiste gesucht
        think: 0
        then:
          - end: Ziel erreicht (total - 2)
      - press: a
      - wait_for: GG2 Ersetzen R.png
      - press: r
      - press: b                # Kampfrunde 1
      - expect_not: GG Auto 1 B.png   # erst weiter, wenn der Dialog zu ist: "Auto 2" sieht ihm sehr ähnlich (0,93)
        think: 0
      - first_seen:             # nach Runde 1 kommt entweder das Ergebnis oder Kampfrunde 2
          - if: GG OK ESC.png   # fertig nach einer Runde
            then:
              - press: esc
          - if: GG Auto 2 B.png # es gibt eine zweite Runde
            then:
              - press: b        # Kampfrunde 2
              - wait_for: GG OK ESC.png
                timeout: 30     # Kampf kann dauern
              - press: esc
        timeout: 30             # so lange dauert Runde 1 höchstens

