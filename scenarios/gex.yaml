name: Gex
hotkey: ctrl+alt+2

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.2, 0.4]      # Pause vor jedem Schritt (s), Standard [0.4, 1.2]
  move_speed: 1.2               # Maus 1,5× schneller als normal
  hover_time: [0.1, 0.3]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


repeat:
  while: Gex1 Pfeil.png
  until: Gex End.png
  timeout: 5
  # max: 50                     # optional: höchstens so viele Runden

steps:
  - click: Gex1 Pfeil.png     # Kampf
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - first_seen:                 # eines von beiden erscheint, das erste gewinnt
      - if: Gex2a D A.png
        then:
          - press: a            
      - if: Gex2b A A.png
        then:
          - press: a            
  - wait_for: Gex3 Ersetzen R.png
  - press: r
  - wait_for: Gex4 Auto B.png
  - press: b
  - if_seen: Gex4 Auto B.png
    timeout: 0.5
    then:
      - press: b
  - wait_for: Gex5 OK ESC.png
    timeout: 5
  - if_seen: Gex Niederlage.png
    timeout: 0.5                # nur kurz nachsehen, sonst kostet jeder Sieg die vollen 10 s
    then:
      - press: esc
      - end: Niederlage         # Ablauf sofort beenden, der Text erscheint im Bericht
  - if_seen: Gex Sieg.png
    timeout: 0.5                # nur kurz nachsehen, sonst kostet jeder Sieg die vollen 10 s
    then:
      - press: esc              #weiter
  - click: GEX1 Pfeil.png       # Belohnung
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - if_seen: pvp5 Optional ESC.png
    timeout: 1.5                  # so lange wird höchstens darauf gewartet
    then:
      - press: esc
  - wait: [0.12, 0.43]            # kurz durchatmen, bevor die nächste Runde startet
