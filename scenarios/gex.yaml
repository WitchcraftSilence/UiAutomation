name: Gex
hotkey: ctrl+alt+2

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.1, 0.25]       # Pause vor jedem Schritt (s), Standard [0.4, 1.2]
  move_speed: 1.6               # Maus 1,6× schneller als normal
  hover_time: [0.05, 0.15]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


repeat:
  while: Gex1 Pfeil.png
  until: Gex End.png
  timeout: 5
  # max: 50                     # optional: höchstens so viele Runden

steps:
  - click: Gex1 Pfeil.png     # Kampf
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - first_seen:                 # eines von beiden erscheint, das erste gewinnt
      - if: Gex2a D A.png
        then:
          - press: a
      - if: Gex2b A A.png
        then:
          - press: a
  - wait_for: Gex3 Ersetzen R.png
  - press: r
  - wait_for: Gex4 Auto B.png
  - press: b
  - if_seen: Gex4 Auto B.png
    timeout: 0.5
    then:
      - press: b
  - first_seen:                 # nach dem Kampf kommt entweder das Ergebnis oder die zweite Welle
      - if: Gex5 OK ESC.png
      - if: QI Zweite Welle B.png   # gleiche Überschrift wie bei QI
        then:
          - press: b            # Auto-Kampf für die zweite Welle
          - wait_for: Gex5 OK ESC.png
            timeout: 5
    timeout: 5
  - first_seen:                 # Sieg oder Niederlage, ohne auf das jeweils andere zu warten
      - if: Gex Niederlage.png
        then:
          - press: esc
          - end: Niederlage     # Ablauf sofort beenden, der Text erscheint im Bericht
      - if: Gex Sieg.png
        then:
          - press: esc          # weiter
    timeout: 2
  - first_seen:                 # Relikt auf der Karte einsammeln, falls eines liegt
      - if: GEX Relikt Gold.png
        then:
          - click: GEX Relikt Gold.png
          - wait_for: GEX Relik OK ESC.png    # Abholen des Relikts muss quittiert werden
            timeout: 3
          - click: GEX Relik OK ESC.png       # Klick statt ESC, ESC wird oft verschluckt
          - expect_not: GEX Relik OK ESC.png
            timeout: 3
            note: Relikt-Dialog geschlossen
      - if: GEX Relikt Silber.png
        then:
          - click: GEX Relikt Silber.png
          - wait_for: GEX Relik OK ESC.png
            timeout: 3
          - click: GEX Relik OK ESC.png
          - expect_not: GEX Relik OK ESC.png
            timeout: 3
            note: Relikt-Dialog geschlossen
      - if: GEX Relikt Jade.png
        then:
          - click: GEX Relikt Jade.png
          - wait_for: GEX Relik OK ESC.png
            timeout: 3
          - click: GEX Relik OK ESC.png
          - expect_not: GEX Relik OK ESC.png
            timeout: 3
            note: Relikt-Dialog geschlossen
      - if: Gex1 Pfeil.png      # Karte ist da, aber kein Relikt: nichts tun
    timeout: 5
  - click: GEX1 Pfeil.png       # Belohnung
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - if_seen: pvp5 Optional ESC.png
    timeout: 1.0                # Dialog kommt nach etwa 0,5 s
    then:
      - click: pvp5 Optional ESC.png   # ESC wird hier regelmäßig verschluckt, Klick wirkt sofort
      - expect_not: pvp5 Optional ESC.png  # sonst endet die Schleife scheinbar "ok"
        timeout: 3
        note: Belohnung geschlossen
  - wait: [0.05, 0.15]          # kurz durchatmen, bevor die nächste Runde startet
