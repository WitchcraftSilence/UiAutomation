name: Gex
hotkey: ctrl+alt+2

# Eingespielter Ablauf: kaum Nachdenken, Reaktion wie bei einem erwarteten Dialog
human:
  think_time: [0.1, 0.25]       # Pause vor jedem Schritt (s), Standard [0.4, 1.2]
  move_speed: 1.6               # Maus 1,6× schneller als normal
  hover_time: [0.05, 0.15]      # kürzer über dem Knopf verweilen, Standard [0.08, 0.25]


repeat:
  while: Gex/Gex1 Pfeil.png         # Gex/Gex End.png wird erst am Ende jeder Runde geprüft, nach der Belohnungskiste
  until: Gex/Gex Expedition fertig.png   # alle Schwierigkeitsgrade gelöst: Dialog "Bevorstehende Gilden-Expedition", Ablauf endet
  timeout: 5
  # max: 50                     # optional: höchstens so viele Runden

steps:
  - if_seen: Gemeinsam/OK Braun ESC.png   # verspäteter Belohnungsdialog aus der letzten Runde (der Pfeil ist dahinter
    timeout: 0.3                          # noch zu sehen): erst schließen, sonst trifft der Klick unter den Pfeil den Dialog
    then:
      - click: Gemeinsam/OK Braun ESC.png
        think: 0
        check_end: true         # Abschlussdialog nicht schließen (Expedition fertig)
      - expect_not: Gemeinsam/OK Braun ESC.png
        timeout: 2
  - click: Gex/Gex1 Pfeil.png     # Kampf
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - first_seen:                 # eines von beiden erscheint, das erste gewinnt
      - if: Gex/Gex2a D A.png
        then:
          - press: a
      - if: Gex/Gex2b A A.png
        then:
          - press: a
  - wait_for: Gex/Gex3 Ersetzen R.png
  - press: r
  - wait_for: Gex/Gex4 Auto B.png
  - press: b
  - if_seen: Gex/Gex4 Auto B.png
    timeout: 0.5
    then:
      - press: b
  - first_seen:                 # nach dem Kampf kommt entweder das Ergebnis oder die zweite Welle
      - if: Gex/Gex5 OK ESC.png
      - if: Gemeinsam/QI Zweite Welle B.png   # gleiche Überschrift wie bei QI
        then:
          - press: b            # Auto-Kampf für die zweite Welle
          - wait_for: Gex/Gex5 OK ESC.png
            timeout: 5
    timeout: 5
  - first_seen:                 # Sieg oder Niederlage, ohne auf das jeweils andere zu warten
      - if: Gemeinsam/GG Niederlage.png
        then:
          - press: esc
          - end: Niederlage     # Ablauf sofort beenden, der Text erscheint im Bericht
      - if: Gex/Gex Sieg.png
        then:
          - press: esc          # weiter
    timeout: 2
  - click: Gex/Gex1 Pfeil.png       # Belohnung
    offset: [0, 4.2h]           # 1,5 × Bildhöhe unterhalb der Bildmitte
    note: unter dem Pfeil
  - repeat:                      # Belohnungsdialoge schließen, manchmal kommen zwei nacheinander
      while: Gemeinsam/OK Braun ESC.png
      until: Gex/GEX PlayNextLevel.png    # Abschlussdialog hat auch OK: nicht schließen, collect_relics klickt "Jetzt spielen"
      timeout: 1.0              # Dialog kommt nach etwa 0,5 s
      max: 8                      # je Dialog bis zu 2 Runden (eine davon sieht den schließenden)
    steps:
      - wait: [0.4, 0.6]        # Dialog fertig eingeblendet, ein schließender ist weg
      - if_seen: Gemeinsam/OK Braun ESC.png  # noch da? (der schließende war eben noch kurz zu sehen)
        timeout: 0.3
        then:
          - click: Gemeinsam/OK Braun ESC.png   # ESC wird hier regelmäßig verschluckt, Klick wirkt sofort
            think: 0
            check_end: true     # vor dem Klick nach "Jetzt spielen" sehen (until)
  - wait: [0.3, 0.5]            # Relikt erscheint erst nach dem Öffnen der Kiste

  # Nach dem Öffnen der Kiste: Relikt einsammeln, falls eines liegt.
  # Die Relikt-Fälle stehen einmal hier mit Anker (&name) und werden im ersten Schritt
  # mit *name wiederverwendet (YAML-Anker, kein eigener Schritt).
  - first_seen:
      - &next_level
        if: Gex/GEX Next Level.png  # Level fertig (Dialog verdeckt die Karte): im nächsten Schritt
      - if: Gemeinsam/OK Braun ESC.png   # verspäteter Belohnungsdialog (z. B. beim letzten Fragment, kommt erst nach
        then:                            # 2-3 s): erst schließen, dann nach Relikten sehen. Muss vor dem Pfeil
          - &ok_schliessen               # stehen, der ist hinter dem Dialog noch zu sehen (0,9)
            repeat:                      # OK, solange Dialoge kommen
              while: Gemeinsam/OK Braun ESC.png
              until: Gex/GEX PlayNextLevel.png    # Abschlussdialog hat auch OK: nicht schließen, collect_relics klickt "Jetzt spielen"
              timeout: 1
              max: 8                      # je Dialog bis zu 2 Runden (eine davon sieht den schließenden)
            steps:
              - wait: [0.4, 0.6]          # Dialog fertig eingeblendet, ein schließender ist weg
              - if_seen: Gemeinsam/OK Braun ESC.png   # noch da? (der schließende war eben noch kurz zu sehen)
                timeout: 0.3
                then:
                  - click: Gemeinsam/OK Braun ESC.png   # Klick statt ESC, ESC wird oft verschluckt
                    think: 0
                    check_end: true       # vor dem Klick nach "Jetzt spielen" sehen (until)
          - first_seen:                  # danach wie unten: Relikt einsammeln, falls eines liegt
              - *next_level
              - &relikt_gold
                if: Gex/GEX Relikt Gold.png
                then:
                  - click: Gex/GEX Relikt Gold.png
                  - &relikt_quittieren
                    if_seen: Gemeinsam/OK Braun ESC.png     # Abholen quittieren; kommt nichts, ist das Relikt noch nicht erreichbar
                    timeout: 1.0                      # sonst kommt der Dialog nach etwa 0,3 s
                    then:
                      - *ok_schliessen                # nach dem Relikt kommt manchmal noch eine Belohnung
              - &relikt_silber
                if: Gex/GEX Relikt Silber.png
                then:
                  - click: Gex/GEX Relikt Silber.png
                  - *relikt_quittieren
              - &relikt_jade
                if: Gex/GEX Relikt Jade.png
                then:
                  - click: Gex/GEX Relikt Jade.png
                  - *relikt_quittieren
              - &kein_relikt
                if: Gex/Gex1 Pfeil.png      # Karte ist da, aber kein Relikt: nichts tun
              - &level_fertig
                if: Gex/GEX ReliktVorhanden.png   # immer sichtbar: kein Pfeil und kein Relikt in Sicht, Level fertig, im nächsten Schritt
            timeout: 5
      - *relikt_gold
      - *relikt_silber
      - *relikt_jade
      - *kein_relikt
      - *level_fertig
    timeout: 5
  - collect_relics:             # Level fertig: restliche Relikte auf der Karte suchen, dann "Jetzt spielen"
      relics: [Gex/GEX Relikt Gold.png, Gex/GEX Relikt Silber.png, Gex/GEX Relikt Jade.png]
      ok: Gemeinsam/OK Braun ESC.png
      marker: Gex/GEX ReliktVorhanden.png   # immer sichtbar: farbig = noch Relikte auf der Karte, grau = keine
      done: Gex/GEX Next Level.png          # Abschlussdialog, kommt bei übrigen Relikten manchmal gar nicht
      next: Gex/GEX PlayNextLevel.png       # "Jetzt spielen"
      unless: Gex/Gex1 Pfeil.png            # nächster Kampf sichtbar: Level nicht fertig, nichts tun
    timeout: 3
  - if_seen: Gex/Gex End.png        # Versuche zu Ende, erst nach der Belohnungskiste prüfen
    timeout: 0.3
    then:
      - end: Versuche zu Ende
  - wait: [0.05, 0.15]          # kurz durchatmen, bevor die nächste Runde startet
